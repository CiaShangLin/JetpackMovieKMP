schema: spec-driven

flow:
  worktree_base: ../JetpackMovieKMP-worktrees
  verify_tools:
    unit_test:
      - name: ngs-android-unit-testing
        kind: skill
        platforms: [android]
        default: true
      - name: swift-testing-pro
        kind: skill
        platforms: [ios]
        default: true
    doc_comment:
      - name: ngs-kdoc
        kind: skill
        platforms: [android]
        default: true
      - name: swift-api-design-guidelines-skill
        kind: skill
        platforms: [ios]
        default: true
    code_review:
      - name: ngs-code-review
        kind: skill
        platforms: [android]
        default: true
      - name: swift-architecture-skill
        kind: skill
        platforms: [ios]
        default: true
      - name: swiftui-patterns
        kind: skill
        platforms: [ios]
  verify_commands:
    lint:
      android: ./gradlew ktlintCheck
      ios: ./gradlew iosFormat iosFormatCheck iosLint

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  ## 專案架構
  - 本專案為 Kotlin Multiplatform 電影 App；Android 使用 Compose 與 Navigation3，iOS 使用 SwiftUI。
  - 共用資料流為 shared/network、shared/database、shared/datastore → shared/data → shared/domain → UI。
  - shared/app 負責組裝所有 Koin module，並輸出名為 Shared 的 iOS static framework。
  - Android feature 位於 feature/*，Android 共用 UI 位於 core/*，iOS UI 與入口位於 iosApp。
  - 可跨平台共用的 business logic 與 UI logic 優先放 shared；平台差異使用對應 source set 或 iosApp 實作。
  - 第三方依賴版本與 alias 統一由 gradle/libs.versions.toml 管理，不使用 buildSrc 版本常數。

  ## 開發與驗證慣例
  - OpenSpec artifacts、PR 標題與說明，以及 public API 文件使用繁體中文（zh-TW）。
  - Kotlin 測試採 AAA（Arrange / Act / Assert）模式。
  - shared/common、shared/data、shared/database、shared/datastore、shared/domain、shared/network 設有 Kover 80% 下限。
  - commonMain 變更至少執行受影響模組的 Android host test；iosMain、expect/actual 或 Swift interop 變更需在 macOS 補跑 iOS simulator test。
  - Commit 前需通過 ktlintCheck；修改 iOS/Swift 時另執行 iosFormat、iosFormatCheck 與 iosLint。
  - 文件中的 Gradle 指令使用 ./gradlew；Windows PowerShell 執行等效的 .\gradlew.bat。
  - key.properties、local.properties、簽章檔與其他 secrets 或機器設定不得進版控。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "Impact 段落必須使用實際 Gradle module path 列出受影響模組（例如 feature/home、shared/domain、core/ui），並標示受影響平台與 source set"
    - "若修改 shared public API，Impact 必須列出 Android 呼叫端、shared/app iOS 匯出邊界與 Swift 消費端的相容性影響"
    - "若新增或調整第三方依賴，需列出 gradle/libs.versions.toml 的 version/library/plugin alias 與使用該 alias 的模組"
    - "需明確列出不在本次範圍的相鄰模組或平台，避免 change 在實作期間無界擴張"
  specs:
    - "Purpose 必須以繁體中文（zh-TW）完整說明 capability 的目的與邊界，不得只寫一句過短摘要"
    - "Requirement 與 Scenario 需以繁體中文（zh-TW）撰寫；每個 Requirement 必須保留英文 SHALL 或 MUST 關鍵字"
    - "每個 Requirement 至少包含一個具體 Scenario，並使用可驗證的 WHEN 與 THEN"
    - "涉及載入、網路、資料庫、Paging 或非同步狀態時，需依適用範圍涵蓋失敗、空資料、重試、取消或恢復情境"
  design:
    - "Decisions 段落需說明是否維持 Repository、UseCase、Koin module 與既有模組依賴方向；若偏離需說明原因"
    - "Android UI 變更需說明 Compose、ViewModel 與 Navigation3 的狀態或導覽邊界；iOS UI 變更需說明 SwiftUI、ViewModel 與 KoinHelper/Shared bridge 邊界"
    - "修改 shared API、Flow、Paging、sealed class 或 nullable 型別時，需分析 Kotlin/Swift 匯出型別、生命週期、取消與錯誤處理風險"
    - "若變更涉及資料庫 schema，需在 Risks / Trade-offs 註明 Room migration 策略"
    - "若涉及語言、locale、日期、時區或文字資源，需分析 Android 與 iOS 的行為差異及刷新策略"
  tasks:
    - "實作 task group 原則上依實際 module 分組（例如 shared/network、shared/data、feature/home、iosApp），最後可另設跨模組驗證 group"
    - "每個受影響模組都需包含對應測試任務；若無法或不適合自動測試，必須記錄原因與替代驗證方式"
    - "修改設有 Kover 規則的 shared 模組時，需加入該模組的 koverVerify；UI 模組只要求對應 ViewModel 或狀態邏輯測試，不宣稱具有 80% module gate"
    - "修改 commonMain 時需加入受影響模組的 testAndroidHostTest；修改 iosMain、expect/actual 或 Swift interop 時需加入 iosSimulatorArm64Test，並標示 macOS/Xcode 環境限制"
    - "Android UI 或導覽變更需加入相關單元測試及必要的 androidApp assembleDebug；Swift 變更需加入 Swift tests、iosFormatCheck 與 iosLint"
    - "新增或修改 API 呼叫時，只為實際受影響層建立任務：shared/network 的 DataSource/Response、shared/data 的 Mapper/Repository、shared/model 的對外 model、shared/domain 的 UseCase，以及 shared/app 的 iOS bridge/DI"
    - "最終驗證 group 必須包含 openspec validate <change-name> --type change --strict --no-interactive，並列出本次 change 實際需要的 lint、test、coverage 與 build 指令"
