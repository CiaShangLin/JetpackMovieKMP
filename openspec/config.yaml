schema: spec-driven

flow:
  worktree_base: ../JetpackMovieKMP-worktrees
  verify_notes:
    doc_comment:
      ios: >
        目前尚無對應的 iOS DocC 註解檢查工具，文件註解暫以人工確認為主；
        待日後建立正式 skill 後再改走 verify_tools 委派。
  verify_tools:
    unit_test:
      - name: ngs-android-unit-testing
        kind: skill
        platforms: [android]
        default: true
      - name: swift-testing-pro
        kind: skill
        platforms: [ios]
        default: true
    doc_comment:
      - name: ngs-kdoc
        kind: skill
        platforms: [android]
        default: true
    code_review:
      - name: ngs-code-review
        kind: skill
        platforms: [android]
        default: true
      - name: code-review
        kind: skill
        default: true
  verify_commands:
    lint:
      android: ./gradlew ktlintCheck
      ios: ./gradlew iosFormatCheck iosLint

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  ## 慣例
  - 註解與文件一律使用繁體中文(zh-tw)
  - Commit 前需通過 ktlintCheck；若有修改 iOS/Swift 程式碼，需另外執行 iosFormat + iosFormatCheck + iosLint
  - 測試採 AAA 模式（Arrange/Act/Assert），最低 80% 單元測試覆蓋率
  - API 金鑰放 key.properties（不進版控）

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "Impact 段落必須列出受影響的 module（例如 feature/home、core/domain）"
    - "若涉及新增依賴，需註明會動到 buildSrc 的哪些檔案（DependenciesVersions/Dependencies/DependenciesProvider）"
  specs:
    - "Requirement 與 Scenario 需以繁體中文(zh-tw) 撰寫"
  design:
    - "Decisions 段落需說明是否遵循既有 MVVM / MVI / Repository / Use Case 模式，若偏離需說明原因"
    - "若變更涉及資料庫 schema，需在 Risks / Trade-offs 註明 Room migration 策略"
  tasks:
    - "每個 task group 對應一個 module（例如 core/domain、feature/home、core/network）"
    - "涉及 UI 的 task 需包含對應的單元測試任務，維持最低 80% 覆蓋率"
    - "新增或修改 API 呼叫的 task 需包含 core/network 攔截器或 model 的更新項目"
